<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps Basics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Task Manager</h1>

        <form id="task-form">

            <input
                id="task-input"
                type="text"
                placeholder="Enter a task"
                required
            >

            <button type="submit">
                Add Task
            </button>

        </form>

        <ul id="task-list"></ul>

    </main>

    <script src="app.js"></script>

</body>

</html>
